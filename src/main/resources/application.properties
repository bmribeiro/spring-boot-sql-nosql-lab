# Application
spring.application.name=spring-boot-sql-nosql-lab

# PostgreSQL - DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_sql
spring.datasource.username=admin
spring.datasource.password=secret

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# MongoDB
spring.data.mongodb.uri=mongodb://admin:secret@localhost:27017/ecommerce_nosql?authSource=admin
spring.data.mongodb.auto-index-creation=true

# Spring MVC - Problem Details
spring.mvc.problemdetails.enabled=true